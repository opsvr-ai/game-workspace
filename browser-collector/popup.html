<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>对标笔记采集器</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .primary {
        background: #ff2442;
        color: #fff;
      }
      .ghost {
        background: #f2f3f5;
        color: #333;
      }
      .note {
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .note a {
        color: #222;
        font-weight: 600;
        text-decoration: none;
      }
      .meta {
        color: #999;
        font-size: 12px;
        margin-top: 3px;
      }
      textarea {
        width: 100%;
        height: 120px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 8px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <h1>已采集长尾词</h1>
    <div class="actions">
      <button id="copyKeywords" class="ghost">复制长尾词</button>
      <button id="clearKeywords" class="ghost">清空长尾词</button>
    </div>
    <div id="keywordList"></div>
    <hr />
    <h1>已采集笔记</h1>
    <div class="actions">
      <button id="copy" class="primary">复制 JSON</button>
      <button id="clear" class="ghost">清空</button>
    </div>
    <div id="list"></div>
    <textarea id="json"></textarea>

    <script src="popup.js"></script>
  </body>
</html>
