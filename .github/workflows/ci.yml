name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 类型 + lint + 测试：最快能给出「这次改动有没有把东西改坏」的反馈。
  check:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chunlv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chunlv/shared build
      - name: typecheck（全仓）
        run: pnpm -r typecheck
      # 只卡 error、不卡 warning：warning 是历史积压（约 2800 条，主要是 no-explicit-any），
      # 属于 burn-down 范畴，见 docs/REFACTOR-PLAN.md。error 必须保持为 0。
      - name: lint（只卡 error）
        run: pnpm -r lint
      # 契约冻结（docs/REFACTOR-PLAN.md 前提 3）：接口路径与 Socket 事件名是四端共用的契约，
      # 重构期间不得变更。脚本从 Controller / Gateway 源码重新导出一次再比对，
      # 谁不小心改了路径或事件名，这里直接红。
      - name: 契约冻结（接口路径 / Socket 事件名）
        run: node scripts/_export_api_contract.mjs --check
      # UI 硬编码色值冻结（docs/REFACTOR-PLAN.md 15.3 / P2-7）：界面「漂移」的根因是颜色到处手写
      # （曾经同时存在三套主色）。只清一批不够，还得「只能减不能增」：
      # 基线见 docs/UI-TOKEN-BASELINE.json，谁新写了硬编码色值这里直接红。
      - name: UI 硬编码色值冻结
        run: node scripts/_check_ui_tokens.mjs --check
      # 加载态冻结（2026-10-07）：全站「正在加载」原来有四种画法（裸转圈 / Spin tip /
      # 塞进 Card 再补 padding / 拿空态插画冒充），同一种「还没来」长得都不一样，
      # 而且没写明占多高 → 一加载整页跳一下。统一到 LoadingState 后，这里卡「不许再写裸 <Spin />」。
      # 基线见 docs/LOADING-STATE-BASELINE.json（当前 0）。
      - name: 加载态冻结（不许裸写 Spin）
        run: node scripts/_check_loading_state.mjs --check
      # 统计卡冻结（2026-10-07）：看板上的「一个大数字」原来有四种长相（运营看板 / 陪玩端首页 /
      # 客户看板 / 支出审核各写各的），统一到 components/StatCard.tsx。这里卡「自己再写一个 Kpi /
      # <Card><Statistic/> 拼统计卡」。基线见 docs/STAT-CARD-BASELINE.json（当前 0 + 31，只能减不能增）。
      - name: 统计卡冻结（看板大数字只有一个来源）
        run: node scripts/_check_stat_cards.mjs --check
      # 提示层出口冻结（docs/REFACTOR-PLAN.md P2-8「反馈层无统一出口」）：全站 600 多处提示以前
      # 都各自从 antd 直接 import message —— 「同一句话连着弹两条」这类问题没法收口，想改提示
      # 得全局搜 600 处。统一走 apps/web/src/utils/feedback.ts（同名同形，调用点一个字不用改）后，
      # 谁再直接从 antd import message 这里就红（目标恒为 0）。
      - name: 提示层出口冻结（提示只留一个出口）
        run: node scripts/_check_feedback_layer.mjs --check
      # 路由分包守卫（2026-10-07）：50 个页面原来全是同步 import，首屏必须把所有页面的代码
      # 都下载 + 解析完才画出第一帧（主包 1.2MB）。改成按路由 lazy 之后主包 347KB。
      # 但「新加一个页面」时同步 import 是最自然的写法，写下去没人会觉得不对 —— 这里拦住它。
      # 顺手量入口分包体积（有构建产物时），悄悄塞回大页面会超上限。
      - name: 路由分包守卫（页面必须懒加载）
        run: node scripts/_check_route_splitting.mjs
      # CSS 变量兜底 + 变量定义完整性（2026-10-07）：index.css 的 :root 是从 tokens.ts
      # 生成出来的，手抄漏了这里直接红；顺带卡「CSS 里用了 var(--x) 但没人定义」——
      # 上一版就漏了 --grad-brand-hover / --grad-brand-active，导致主按钮悬浮态是无效声明。
      - name: CSS 变量兜底一致性
        run: node scripts/_export_css_vars.mjs --check
      # 路由契约冻结（docs/REFACTOR-PLAN.md 前提 3）：页面路径是四端共用的导航契约 ——
      # 陪玩端 / 客服端内嵌窗口、看门狗、客服发出去的链接都写死这些 URL。
      # router.tsx 现在 86 条路由、每条外面包一层 <Suspense>，重构时最容易「顺手」删掉老路径；
      # 表在 docs/WEB-ROUTES.json，少了 / 改了 / 换了页面这里直接红。
      - name: 路由契约冻结（页面路径）
        run: node scripts/_export_web_routes.mjs --check
      # 前端第一份测试（2026-10-07）：锁住「四个角色各能看到哪些菜单」+「菜单里写的路由必须真实存在」。
      # 前端以前零测试，而 AppLayout / roleMenus 正是要重构的地方；菜单少一项、路径写错一个字，
      # 在界面上都只是「点了打不开」，靠人点是点不完的。
      - name: 前端测试（左栏导航契约）
        run: pnpm --filter @chunlv/web test
      - name: 服务端测试
        run: pnpm --filter @chunlv/server test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chunlv_test?schema=public
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
      # 陪玩端（Electron 主进程）测试（2026-10-07）：这一端会自己「下好新版 → 等陪玩空闲 →
      # 写信号让看门狗换文件重启」。这段判断错了的后果不是「页面打不开」，而是这台机器接不了单
      # （线上真发生过：同机装了客服端，更新信号被看门狗按客服端解压，陪玩端被换掉）。
      # 所以这里盯住那几个「决定要不要动用户机器」的判断：跨端信号 / 拉黑版本 / 同一个包别反复下 / 备货包能否用。
      - name: 陪玩端测试（主进程判断层）
        run: pnpm --filter @chunlv/companion-electron test
      # 客服端（Electron 主进程）测试（2026-10-07）：客服端只有一条路会碰到用户机器 —— 自动升级。
      # 走错了不是「页面难看」，而是这台机器上的客户端起不来 / 陪玩端被换成客服端（那台机器接不了单）。
      # 这一批把那几个判断抽成 update-decisions.js（以前埋在 700 行的 main.js 里，测不了），
      # 顺便加了一条「打包白名单别漏文件」的守卫：装机版漏打一个 require 的文件 = 一台机器启动即崩。
      - name: 客服端测试（更新决策层 + 打包白名单）
        run: pnpm --filter @chunlv/cs-electron test
      # 看门狗（SystemHelper）Go 测试（2026-10-07）：它是「陪玩端 / 客服端自动更新」的唯一落地执行者，
      # 以前零测试，改一行只能靠真机回归。本批新增的「更新信号按端隔离」正是靠这组测试守住 ——
      # 一台电脑同时装了两端时，绝不能让 A 端的包被解压进 B 端的目录。
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/watchdog-service/go.mod
          cache-dependency-path: apps/watchdog-service/go.sum
      - name: 看门狗测试（Go）
        working-directory: apps/watchdog-service
        run: go test ./...

  # 打包：重构期最容易「类型过了但打不出包」（vite 分包、Nest 构建产物路径）。
  # 2026-10-06 加上：此前 CI 不跑 build，打包挂了只能靠本地发现。
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 打包完再量一次入口分包体积（check 任务里没有 dist，量不到这一项）。
      - name: 路由分包守卫（入口分包体积）
        run: node scripts/_check_route_splitting.mjs
