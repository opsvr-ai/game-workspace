appId: com.chunlv.cs
productName: 客服管理
directories:
  output: release
files:
  - main.js
  # 更新决策（跨端保护 / 拉黑版本）：main.js 会 require 它，
  # electron-builder 只打包这里列的文件 —— 漏了这一行，装机版一启动就 require 不到直接崩。
  - update-decisions.js
  - machine-agent.js
  - preload.js
  - package.json
extraResources:
  - from: config.json
    to: config.json
  # 托盘图标必须一起打包：以前只打包了 config.json，运行时在 resources 里
  # 找不到 donkey.ico，托盘就是个透明空图标（右下角看不见图标）。
  - from: public/donkey.ico
    to: donkey.ico
  # 看门狗服务本体：装机时由 build/installer.nsh 装成 SystemHelper 服务，
  # 之后的自动更新也靠它（系统权限）解压换装 —— 客服端「全自动、不弹授权」的关键。
  - from: ../watchdog-service/SystemHelper.exe
    to: SystemHelper.exe
win:
  icon: public/donkey.ico
  target:
    - target: nsis
      arch: [x64]
  sign: null
nsis:
  oneClick: true
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 客服管理
  installerIcon: public/donkey.ico
  uninstallerIcon: public/donkey.ico
  include: build/installer.nsh
