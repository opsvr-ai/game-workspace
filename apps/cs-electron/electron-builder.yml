appId: com.chunlv.cs
productName: 客服管理
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
extraResources:
  - from: config.json
    to: config.json
win:
  icon: public/donkey.ico
  target:
    - target: nsis
      arch: [x64]
  sign: null
nsis:
  oneClick: true
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 客服管理
  installerIcon: public/donkey.ico
  uninstallerIcon: public/donkey.ico
