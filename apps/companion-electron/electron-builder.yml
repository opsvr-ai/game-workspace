appId: com.chunlv.companion
productName: 蠢驴电竞
directories:
  output: release
files:
  - dist-electron
  - dist
  - preload-dist
  - package.json
asar: true
asarUnpack:
  - node_modules/socket.io-client/**
extraResources:
  - from: companion-config.json
    to: .
  - from: ../watchdog-service/SystemHelper.exe
    to: SystemHelper.exe
win:
  icon: public/donkey.ico
  target:
    - target: nsis
      arch: [x64]
  sign: null
nsis:
  oneClick: true
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 蠢驴电竞陪玩
  installerIcon: public/donkey.ico
  uninstallerIcon: public/donkey.ico
  installerHeaderIcon: public/donkey.ico
  include: installer.nsh
