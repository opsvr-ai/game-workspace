appId: com.chunlv.companion
productName: 蠢驴电竞
directories:
  output: release
files:
  - dist-electron
  - dist
  - preload-dist
  - package.json
win:
  icon: public/donkey.ico
  target:
    - target: nsis
      arch: [x64]
  sign: null
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 蠢驴电竞陪玩
  installerIcon: public/donkey.ico
  uninstallerIcon: public/donkey.ico
  installerHeaderIcon: public/donkey.ico
