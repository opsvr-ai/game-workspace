appId: com.chunlv.companion
# 2026-10-18：老板要求安装器 / 开始菜单也彻底改名。productName 改为中性品牌，
# 但 **exe 名 + 安装目录继续用「陪玩管理」**（win.executableName + installer.nsh 写死）——
# 自动更新包、看门狗路径、换端脚本都按这个目录/exe 认客户端，改了会让存量机器更新后起不来。
# 用户能看到的：安装器标题 / 开始菜单 / 应用列表 / 桌面图标 = 蠢驴电竞；安装目录仍是 陪玩管理。
productName: 蠢驴电竞
artifactName: 蠢驴电竞-Setup-${version}.${ext}
directories:
  output: release
files:
  - dist-electron
  - preload-dist
  - package.json
  - node_modules/socket.io-client/**
asar: true
extraResources:
  - from: companion-config.json
    to: .
  - from: ../watchdog-service/SystemHelper.exe
    to: SystemHelper.exe
  # 托盘图标要一起打包，否则运行时读不到图片、右下角托盘是个透明空图标。
  - from: public/donkey.png
    to: donkey.png
  # 托盘上真正显示的那张：绿色方块 + 白驴（陪玩端专用，跟客服端的蓝色区分开）。
  - from: public/tray-companion.png
    to: tray-companion.png
win:
  icon: public/donkey.ico
  # 保持 exe 名不变：自动更新 zip 按 win-unpacked 整包替换，看门狗按当前 exe 认客户端。
  executableName: 陪玩管理
  target:
    - target: nsis
      arch: [x64]
  sign: null
nsis:
  oneClick: true
  perMachine: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 蠢驴电竞
  uninstallDisplayName: 蠢驴电竞
  installerIcon: public/donkey.ico
  uninstallerIcon: public/donkey.ico
  installerHeaderIcon: public/donkey.ico
  include: installer.nsh
